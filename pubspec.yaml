  fl_chart: ^1.1.1
  connectivity_plus: ^6.1.5
  shared_preferences: ^2.5.4
  translator: ^1.0.4+1
  flutter_secure_storage: ^10.0.0
  live_activities: ^2.4.6
  home_widget: ^0.9.0
