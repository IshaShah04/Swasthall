name: swasthall
description: "Swasthall — Healthy for All. Nepal's family healthcare super-app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # PDF & Reporting
  pdf: ^3.11.0
  printing: ^5.14.2
  path_provider: ^2.1.2
  share_plus: ^12.0.0
  barcode: ^2.2.6
  barcode_widget: ^2.0.4

  # Payment Gateway
  esewa_flutter: ^3.0.1
  crypto: ^3.0.6
  
  # Maps & Location
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  
  # Utilities & Media
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  meta: ^1.17.0
  
  # ZEGO Cloud & Backend
  zego_uikit_prebuilt_call: ^4.22.2
  permission_handler: ^12.0.1
  supabase_flutter: ^2.12.0
  intl: ^0.20.2
  zego_uikit_signaling_plugin: ^2.8.20
  zego_uikit: ^2.28.41
  image_picker: ^1.2.1
  path: ^1.9.1
  file_picker: ^10.3.8
  flutter_local_notifications: ^21.0.0-dev.2
  timezone: ^0.11.0
  syncfusion_flutter_pdfviewer: ^31.1.21
  flutter_pdfview: ^1.4.4
  gal: ^2.3.2
  dio: ^5.9.0
  http: ^1.6.0
  alarm: ^5.2.1
  flutter_tts: ^4.2.5
  fl_chart: ^1.1.1
  connectivity_plus: ^6.1.5
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  live_activities: ^2.4.6
  home_widget: ^0.9.0
  flutter_native_splash: ^2.4.7
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  app_links: ^6.4.1
  google_mlkit_translation: ^0.13.1
  uuid: ^4.5.3
  timeago: ^3.7.1
  firebase_crashlytics: ^5.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ── LAUNCHER ICON CONFIGURATION ───────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/swasthall_icon.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/swasthall_icon.png"

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/swasthall_icon.png
  
  android_12:
    color: "#F8FAFC"
    image: assets/swasthall_icon.png
    icon_background_color: "#F8FAFC" 
  
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/data/nepal_medicines.json
    - assets/data/nepal_medicines_ne.json
    - assets/data/nepal_medicines_hi.json
    - env.json
    - assets/swasthall_logo.png
    - assets/swasthall_icon.png
    - assets/swasthall_logo_white.png
    - assets/alarm.mp3
    - assets/swasthall_ringtone.mp3
