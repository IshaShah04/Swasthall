name: Flutter Build & Release

on:
  push:
    branches:
      - main

jobs:
  build_android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Mask Secrets
        run: |
          echo "::add-mask::${{ secrets.SUPABASE_URL }}"
          echo "::add-mask::${{ secrets.SUPABASE_ANON_KEY }}"
          echo "::add-mask::${{ secrets.ZEGO_APP_ID }}"
          echo "::add-mask::${{ secrets.ZEGO_APP_SIGN }}"
          echo "::add-mask::${{ secrets.ESEWA_SDK_SECRET_ID }}"
          echo "::add-mask::${{ secrets.FCM_SERVER_KEY }}"
          echo "::add-mask::${{ secrets.GOOGLE_SERVICES_JSON }}"

      - name: Generate env.json
        run: |
          cat > env.json << EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "ZEGO_APP_ID": "${{ secrets.ZEGO_APP_ID }}",
            "ZEGO_APP_SIGN": "${{ secrets.ZEGO_APP_SIGN }}",
            "ESEWA_SDK_CLIENT_ID": "${{ secrets.ESEWA_SDK_CLIENT_ID }}",
            "ESEWA_SDK_SECRET_ID": "${{ secrets.ESEWA_SDK_SECRET_ID }}",
            "ESEWA_SDK_ENVIRONMENT": "test",
            "FDA_API_KEY": "${{ secrets.FDA_API_KEY }}",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
            "GOOGLE_VISION_API_KEY": "${{ secrets.GOOGLE_VISION_API_KEY }}"
          }
          EOF

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build Release AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          name: Release v${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate env.json
        run: |
          cat > env.json << EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "ZEGO_APP_ID": "${{ secrets.ZEGO_APP_ID }}",
            "ZEGO_APP_SIGN": "${{ secrets.ZEGO_APP_SIGN }}",
            "ESEWA_SDK_CLIENT_ID": "${{ secrets.ESEWA_SDK_CLIENT_ID }}",
            "ESEWA_SDK_SECRET_ID": "${{ secrets.ESEWA_SDK_SECRET_ID }}",
            "ESEWA_SDK_ENVIRONMENT": "test",
            "FDA_API_KEY": "${{ secrets.FDA_API_KEY }}",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
            "GOOGLE_VISION_API_KEY": "${{ secrets.GOOGLE_VISION_API_KEY }}"
          }
          EOF

      - name: Build Web
        run: flutter build web --release

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: build/web
