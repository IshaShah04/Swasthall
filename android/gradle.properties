# 1. Performance & Memory
# Giving Gradle enough room to handle the build and garbage collection efficiently
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 2. Android Modern Standards
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# 3. Java Toolchain Setup
# auto-detect is TRUE so Gradle can see your system installations
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# Use Gradle's built-in Java toolchain auto-detection for cross-platform builds.

# 4. Kotlin Style
kotlin.code.style=official
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
