# 1. Performance & Memory
# Giving Gradle enough room to handle the build and garbage collection efficiently
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 2. Android Modern Standards
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# 3. Java Toolchain Setup
# auto-detect is TRUE so Gradle can see your system installations
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# FIX: We provide both paths separated by a comma. 
# Use forward slashes and escape colons (C\:/) for Windows compatibility.
org.gradle.java.installations.paths=C\:/Program Files/Microsoft/jdk-17.0.17.10-hotspot,C\:/Program Files/Android/Android Studio/jbr

# 4. Kotlin Style
kotlin.code.style=official